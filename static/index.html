<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRIDAY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 2rem;
            text-align: center;
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        h1 {
            margin: 0;
            font-weight: 600;
            font-size: 2rem;
            background: linear-gradient(to right, #c084fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 1rem;
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .video-container {
            flex: 2;
            min-width: 300px;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .video-wrapper {
            position: relative;
            flex: 1;
            min-width: 300px;
            max-width: 640px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .controls-container {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            width: 100%;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }

        .log-area {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--glass-border);
            overflow-y: auto;
            max-height: 300px;
            font-size: 0.95rem;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .time {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 2rem;
            border-radius: 12px;
            backdrop-filter: blur(16px);
            text-align: center;
            color: white;
            width: 90%;
            max-width: 400px;
        }
        .modal input {
            padding: 0.8rem;
            margin: 1rem 0;
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            box-sizing: border-box;
        }
        
        .scanning-overlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1>FRIDAY</h1>
        <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.9rem;">Mobile Camera Feed via WebSockets</p>
    </header>

    <div class="container">
        <div class="panel video-container">
            <div class="video-wrapper">
                <div id="scanning-indicator" class="scanning-overlay">Scanning... Move head slightly</div>
                <video id="video-stream" autoplay playsinline muted></video>
                <canvas id="overlay-canvas"></canvas>
            </div>
            <div class="video-wrapper">
                <img id="depth-map-image" style="width: 100%; height: 100%; object-fit: cover; display: block;" alt="Depth Map">
            </div>
        </div>

        <div class="panel controls-container">
            <button onclick="analyzeScene()">Analyze Scene (Speak)</button>
            <button onclick="startFaceScan()" style="background: #10b981; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">Register Face</button>
            <button onclick="testAudio()" style="background: #3b82f6; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);">Test Audio</button>
            <button id="voice-toggle-btn" onclick="toggleVoiceCommands()" style="background: #f59e0b; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);">Enable Voice Commands</button>

            <div style="display: flex; justify-content: space-between; margin-top: 1rem; color: #94a3b8; font-size: 0.9rem;">
                <span id="latency-display">Latency: -- ms</span>
                <span id="mode-display">Mode: --</span>
            </div>

            <h3 style="margin: 0; color: #e2e8f0; font-size: 1.1rem; margin-top: 1rem;">Detection Log</h3>
            <div class="log-area" id="log-area">
                <div class="log-entry"><span class="time">System</span> Awaiting camera permissions...</div>
            </div>
        </div>
    </div>

    <div id="name-modal" class="modal">
        <div class="modal-content">
            <h2>Enter Name</h2>
            <p>Face scan complete. Who is this?</p>
            <input type="text" id="person-name" placeholder="Name">
            <button onclick="submitFaceScan()">Save Face</button>
            <button onclick="closeModal()" style="background: #ef4444; margin-top: 10px;">Cancel</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-stream');
        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');
        let ws;
        let lastDetections = [];

        function addLog(message) {
            const logArea = document.getElementById('log-area');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="time">${time}</span> ${message}`;
            logArea.prepend(entry);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    addLog("Camera started successfully.");
                    if (!ws || (ws.readyState !== WebSocket.OPEN && ws.readyState !== WebSocket.CONNECTING)) {
                        connectWebSocket();
                    }
                };
            } catch (err) {
                addLog("Error accessing camera: " + err.message);
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/detect`);
            
            ws.onopen = () => {
                addLog("Connected to AI Detection Server.");
                sendFrame(); 
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // Update Depth Map Image
                if (data.depth_map) {
                    const depthImg = document.getElementById('depth-map-image');
                    depthImg.src = 'data:image/jpeg;base64,' + data.depth_map;
                }
                
                document.getElementById('latency-display').innerText = `Latency: ${data.latency_ms} ms`;
                document.getElementById('mode-display').innerText = `Mode: ${data.mode}`;
                
                if (data.speech && data.speech.length > 0) {
                    for (let text of data.speech) {
                        addLog(`FRIDAY: ${text}`);
                        speakAcknowledge(text);
                    }
                }
                
                drawDetections(data.detections, data.distance);
                // Send the next frame as soon as we get the response
                requestAnimationFrame(sendFrame);
            };
            
            ws.onclose = () => {
                addLog("Disconnected. Reconnecting in 3s...");
                setTimeout(connectWebSocket, 3000);
            };
        }

        const captureCanvas = document.createElement('canvas');
        const captureCtx = captureCanvas.getContext('2d');

        function sendFrame() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                captureCanvas.width = video.videoWidth;
                captureCanvas.height = video.videoHeight;
                captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
                
                captureCanvas.toBlob(blob => {
                    if (blob) ws.send(blob);
                }, 'image/jpeg', 0.5); 
            } else {
                requestAnimationFrame(sendFrame);
            }
        }

        function drawDetections(detections, distances) {
            lastDetections = detections || [];
            distances = distances || [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let det of lastDetections) {
                const [x1, y1, x2, y2] = det.box;
                
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 4;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                
                ctx.fillStyle = '#3b82f6';
                ctx.font = 'bold 24px Outfit, sans-serif';
                let text = `${det.class_name} ${(det.confidence * 100).toFixed(0)}%`;
                
                // Find matching distance for this object
                const distData = distances.find(d => 
                    d.object === det.class_name && 
                    Math.abs(d.box[0] - det.box[0]) < 2 // Match by box coordinates
                );
                
                if (distData) {
                    text += ` - ${distData.distance}`;
                }
                
                ctx.fillText(text, x1, y1 > 28 ? y1 - 10 : 28);
            }
        }

        async function analyzeScene() {
            addLog("Generating detailed scene description...");
            try {
                const response = await fetch('/api/describe_scene');
                const result = await response.json();
                
                if (result.success) {
                    addLog(`Description generated: ${result.description}`);
                    
                    // Play audio directly on the user's device (phone/browser)
                    if ('speechSynthesis' in window) {
                        if (!isAudioMuted) {
                            const utterance = new SpeechSynthesisUtterance(result.description);
                            window.speechSynthesis.speak(utterance);
                        } else {
                            addLog("Audio is muted, description not spoken.");
                        }
                    } else {
                        addLog("Warning: Your browser does not support Text-to-Speech.");
                    }
                } else {
                    addLog(`Error: ${result.description}`);
                }
            } catch (err) {
                addLog(`Request failed: ${err.message}`);
            }
        }

        async function testAudio() {
            addLog("Testing audio...");
            if ('speechSynthesis' in window) {
                if (!isAudioMuted) {
                    const utterance = new SpeechSynthesisUtterance("Audio system is working perfectly");
                    window.speechSynthesis.speak(utterance);
                    addLog("Audio played on device.");
                } else {
                    addLog("Audio is disabled, skipping playback.");
                }
            } else {
                addLog("Warning: Your browser does not support Text-to-Speech.");
            }
            
            // Also call backend to test server-side audio if needed, but primary is device
            if (!isAudioMuted) {
                try {
                    await fetch('/audio/speak?text=Audio system is working perfectly');
                } catch (err) {
                    addLog(`Backend audio request failed: ${err.message}`);
                }
            }
        }

        let isScanning = false;
        let scannedFrames = [];
        let scanInterval;

        function startFaceScan() {
            if (isScanning) return;
            
            isScanning = true;
            scannedFrames = [];
            addLog("Scanning face... Please move your head slightly.");
            document.getElementById('scanning-indicator').style.display = 'block';
            
            let scanCount = 0;
            const maxScans = 5;
            
            scanInterval = setInterval(() => {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    captureCanvas.width = video.videoWidth;
                    captureCanvas.height = video.videoHeight;
                    captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
                    
                    captureCanvas.toBlob(blob => {
                        if (blob) {
                            scannedFrames.push(blob);
                            scanCount++;
                            addLog(`Captured frame ${scanCount}/${maxScans}`);
                            
                            if (scanCount >= maxScans) {
                                finishScan();
                            }
                        }
                    }, 'image/jpeg', 0.8);
                }
            }, 500);
        }

        function finishScan() {
            clearInterval(scanInterval);
            isScanning = false;
            document.getElementById('scanning-indicator').style.display = 'none';
            document.getElementById('name-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('name-modal').style.display = 'none';
            scannedFrames = [];
            document.getElementById('person-name').value = '';
            addLog("Face registration cancelled.");
        }

        async function submitFaceScan() {
            const nameInput = document.getElementById('person-name').value.trim();
            if (!nameInput) {
                alert("Please enter a name.");
                return;
            }
            
            document.getElementById('name-modal').style.display = 'none';
            addLog(`Submitting face registration for ${nameInput}...`);
            
            const formData = new FormData();
            formData.append('name', nameInput);
            
            scannedFrames.forEach((blob, index) => {
                formData.append('files', blob, `frame_${index}.jpg`);
            });
            
            try {
                const response = await fetch('/api/register_face_multi', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                if (result.success) {
                    addLog(`Success: ${result.message}`);
                } else {
                    addLog(`Error: ${result.message}`);
                }
            } catch (err) {
                addLog(`Upload error: ${err.message}`);
            }
            
            scannedFrames = [];
            document.getElementById('person-name').value = '';
        }

        // --- Voice Commands Implementation ---
        let recognition;
        let isVoiceEnabled = false;
        let isAudioMuted = false;

        async function refreshAndAnalyze() {
            addLog("Refreshing video stream for fresh analysis...");
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            lastDetections = [];
            
            await startCamera();
            
            // Wait briefly for the new stream to establish and first frames to process
            setTimeout(() => {
                analyzeScene();
            }, 1500);
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                addLog("Voice Commands error: SpeechRecognition API not supported in this browser.");
                return null;
            }
            
            const rec = new SpeechRecognition();
            rec.continuous = false; // Using false with auto-restart is often more reliable on mobile
            rec.interimResults = false;
            rec.lang = 'en-US';
            
            rec.onstart = () => {
                document.getElementById('voice-toggle-btn').innerText = 'Disable Voice Commands (Listening...)';
                document.getElementById('voice-toggle-btn').style.background = '#ef4444';
            };
            
            rec.onresult = async (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                addLog(`Heard: "${transcript}"`);
                
                // Send natural language query to the Assistant Brain
                try {
                    await fetch('/api/query', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: transcript })
                    });
                } catch (err) {
                    addLog(`Query failed: ${err.message}`);
                }
            };
            
            rec.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    addLog(`Voice recognition error: ${event.error}`);
                }
            };
            
            rec.onend = () => {
                if (isVoiceEnabled) {
                    // Restart automatically to keep listening
                    try {
                        rec.start();
                    } catch(e) {}
                } else {
                    document.getElementById('voice-toggle-btn').innerText = 'Enable Voice Commands';
                    document.getElementById('voice-toggle-btn').style.background = '#f59e0b';
                }
            };
            
            return rec;
        }

        function speakAcknowledge(text) {
            if (isAudioMuted) return;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            }
        }

        function toggleVoiceCommands() {
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }
            
            isVoiceEnabled = !isVoiceEnabled;
            
            if (isVoiceEnabled) {
                addLog("Starting voice commands...");
                try {
                    recognition.start();
                } catch(e) {}
            } else {
                addLog("Stopping voice commands...");
                recognition.stop();
            }
        }
        // ------------------------------------

        // Initialize
        startCamera();
    </script>
</body>
</html>
